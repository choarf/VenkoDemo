name: Pruebas

# Corre las pruebas del backend (API y reportes) en cada push y pull request.
# No toca AWS: las pruebas usan datos simulados.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (API y reportes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # el mismo runtime de las Lambdas (infra/template.yaml)
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt boto3 pytest

      - name: Pruebas del backend
        run: python -m pytest tests -v
