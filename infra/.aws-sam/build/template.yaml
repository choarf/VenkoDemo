AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'VenkoDemo - Akvo Green gateway data (AWS IoT) -> S3 -> Athena/Lambda
  API -> web dashboard + reports.

  '
Parameters:
  DataTopic:
    Type: String
    Default: AKVO/data
    Description: MQTT topic the gateway publishes sensor data to (config.json aws.topic_pub)
  SystemTopic:
    Type: String
    Default: AKVO/system
    Description: MQTT topic the gateway publishes host health to (config.json aws.topic_system)
  PartitionStartDate:
    Type: String
    Default: '2026-01-01'
    Description: First date (yyyy-MM-dd) Athena partition projection considers
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin allowed to call the API (set to the CloudFront URL after
      first deploy)
  ReportTimezone:
    Type: String
    Default: America/Mexico_City
  GlueDatabaseName:
    Type: String
    Default: venko_demo
    AllowedPattern: ^[a-z0-9_]+$
    Description: Athena/Glue database (lowercase, digits, underscore only)
  WebBucketName:
    Type: String
    Default: ''
    Description: Name for the dashboard bucket (globally unique). Empty = auto-generated.
      Changing it replaces the bucket; rerun tools/deploy_web.sh afterwards.
Conditions:
  HasWebBucketName:
    Fn::Not:
    - Fn::Equals:
      - Ref: WebBucketName
      - ''
Globals:
  Function:
    Runtime: python3.14
    Architectures:
    - arm64
    MemorySize: 512
    CodeUri: ../backend/
    Environment:
      Variables:
        BUCKET:
          Ref: DataBucket
        TABLE:
          Ref: AppTable
        GLUE_DB:
          Ref: GlueDatabase
        WORKGROUP:
          Ref: AthenaWorkGroup
        ALLOWED_ORIGIN:
          Ref: AllowedOrigin
        REPORT_TZ:
          Ref: ReportTimezone
        REPORT_FUNCTION:
          Fn::Sub: ${AWS::StackName}-report
Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: venko-demo-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
        - Id: athena-results
          Prefix: athena-results/
          Status: Enabled
          ExpirationInDays: 7
        - Id: exports
          Prefix: exports/
          Status: Enabled
          ExpirationInDays: 7
        - Id: raw-to-ia
          Prefix: raw/
          Status: Enabled
          Transitions:
          - StorageClass: STANDARD_IA
            TransitionInDays: 90
  AppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      - AttributeName: test_id
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      GlobalSecondaryIndexes:
      - IndexName: by_test
        KeySchema:
        - AttributeName: test_id
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
        Projection:
          ProjectionType: ALL
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: firehose.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: write-raw
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:AbortMultipartUpload
            - s3:GetBucketLocation
            - s3:ListBucket
            - s3:ListBucketMultipartUploads
            Resource:
            - Fn::GetAtt:
              - DataBucket
              - Arn
            - Fn::Sub: ${DataBucket.Arn}/*
  DataStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN:
          Fn::GetAtt:
          - DataBucket
          - Arn
        RoleARN:
          Fn::GetAtt:
          - FirehoseRole
          - Arn
        Prefix: raw/data/dt=!{timestamp:yyyy-MM-dd}/
        ErrorOutputPrefix: errors/firehose-data/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 1
        CompressionFormat: UNCOMPRESSED
  SystemStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN:
          Fn::GetAtt:
          - DataBucket
          - Arn
        RoleARN:
          Fn::GetAtt:
          - FirehoseRole
          - Arn
        Prefix: raw/system/dt=!{timestamp:yyyy-MM-dd}/
        ErrorOutputPrefix: errors/firehose-system/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 1
        CompressionFormat: UNCOMPRESSED
  IotRuleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: iot.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: rule-actions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - firehose:PutRecord
            - firehose:PutRecordBatch
            Resource:
            - Fn::GetAtt:
              - DataStream
              - Arn
            - Fn::GetAtt:
              - SystemStream
              - Arn
          - Effect: Allow
            Action: s3:PutObject
            Resource:
            - Fn::Sub: ${DataBucket.Arn}/latest/*
            - Fn::Sub: ${DataBucket.Arn}/errors/*
  DataRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql:
          Fn::Sub: SELECT *, clientid() AS gw, timestamp() AS rx_ms FROM '${DataTopic}'
        Actions:
        - Firehose:
            DeliveryStreamName:
              Ref: DataStream
            RoleArn:
              Fn::GetAtt:
              - IotRuleRole
              - Arn
            Separator: '

              '
        - S3:
            BucketName:
              Ref: DataBucket
            Key: latest/data.json
            RoleArn:
              Fn::GetAtt:
              - IotRuleRole
              - Arn
        ErrorAction:
          S3:
            BucketName:
              Ref: DataBucket
            Key: errors/iot/data/${timestamp()}.json
            RoleArn:
              Fn::GetAtt:
              - IotRuleRole
              - Arn
  SystemRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql:
          Fn::Sub: SELECT *, clientid() AS gw, timestamp() AS rx_ms FROM '${SystemTopic}'
        Actions:
        - Firehose:
            DeliveryStreamName:
              Ref: SystemStream
            RoleArn:
              Fn::GetAtt:
              - IotRuleRole
              - Arn
            Separator: '

              '
        - S3:
            BucketName:
              Ref: DataBucket
            Key: latest/system.json
            RoleArn:
              Fn::GetAtt:
              - IotRuleRole
              - Arn
        ErrorAction:
          S3:
            BucketName:
              Ref: DataBucket
            Key: errors/iot/system/${timestamp()}.json
            RoleArn:
              Fn::GetAtt:
              - IotRuleRole
              - Arn
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId:
        Ref: AWS::AccountId
      DatabaseInput:
        Name:
          Ref: GlueDatabaseName
  DataTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId:
        Ref: AWS::AccountId
      DatabaseName:
        Ref: GlueDatabase
      TableInput:
        Name: readings_raw
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: 'true'
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range:
            Fn::Sub: ${PartitionStartDate},NOW
          projection.dt.interval: '1'
          projection.dt.interval.unit: DAYS
          storage.location.template:
            Fn::Sub: s3://${DataBucket}/raw/data/dt=${!dt}/
        PartitionKeys:
        - Name: dt
          Type: string
        StorageDescriptor:
          Location:
            Fn::Sub: s3://${DataBucket}/raw/data/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              ignore.malformed.json: 'true'
              case.insensitive: 'false'
          Columns:
          - Name: ts
            Type: string
          - Name: gw
            Type: string
          - Name: rx_ms
            Type: bigint
          - Name: devices
            Type: map<string,map<string,struct<val:double,status:string,alarm:string,err:string>>>
  SystemTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId:
        Ref: AWS::AccountId
      DatabaseName:
        Ref: GlueDatabase
      TableInput:
        Name: system_raw
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: 'true'
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range:
            Fn::Sub: ${PartitionStartDate},NOW
          projection.dt.interval: '1'
          projection.dt.interval.unit: DAYS
          storage.location.template:
            Fn::Sub: s3://${DataBucket}/raw/system/dt=${!dt}/
        PartitionKeys:
        - Name: dt
          Type: string
        StorageDescriptor:
          Location:
            Fn::Sub: s3://${DataBucket}/raw/system/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              ignore.malformed.json: 'true'
              case.insensitive: 'false'
          Columns:
          - Name: ts
            Type: string
          - Name: gw
            Type: string
          - Name: rx_ms
            Type: bigint
          - Name: gateway
            Type: string
          - Name: city
            Type: string
          - Name: city_time
            Type: string
          - Name: platform_type
            Type: string
          - Name: cpu_load_percent
            Type: double
          - Name: ram_usage_percent
            Type: double
          - Name: disk_usage_percent
            Type: double
          - Name: ip_address
            Type: string
          - Name: os
            Type: string
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-wg
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 10737418240
        ResultConfiguration:
          OutputLocation:
            Fn::Sub: s3://${DataBucket}/athena-results/
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowOrigin:
          Fn::Sub: '''${AllowedOrigin}'''
        AllowHeaders: '''Content-Type,X-Api-Key'''
        AllowMethods: '''GET,POST,OPTIONS'''
      Auth:
        ApiKeyRequired: true
        AddApiKeyRequiredToCorsPreflight: false
        UsagePlan:
          CreateUsagePlan: PER_API
          Throttle:
            RateLimit: 20
            BurstLimit: 40
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-api
      Handler: api.router.handler
      Timeout: 29
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AppTable
      - AthenaQueryPolicy:
          WorkGroupName:
            Ref: AthenaWorkGroup
      - Statement:
        - Effect: Allow
          Action:
          - glue:GetDatabase
          - glue:GetTable
          - glue:GetPartitions
          Resource: '*'
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource:
            Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-report
      Events:
        Proxy:
          Type: Api
          Properties:
            RestApiId:
              Ref: Api
            Path: /{proxy+}
            Method: ANY
      CodeUri: ApiFunction
    Metadata:
      SamResourceId: ApiFunction
  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-report
      Handler: api.reports.report_handler
      Timeout: 300
      MemorySize: 1024
      Policies:
      - S3CrudPolicy:
          BucketName:
            Ref: DataBucket
      - DynamoDBCrudPolicy:
          TableName:
            Ref: AppTable
      - AthenaQueryPolicy:
          WorkGroupName:
            Ref: AthenaWorkGroup
      - Statement:
        - Effect: Allow
          Action:
          - glue:GetDatabase
          - glue:GetTable
          - glue:GetPartitions
          Resource: '*'
      Events:
        Weekly:
          Type: Schedule
          Properties:
            Schedule: cron(0 12 ? * MON *)
            Input: '{"kind": "weekly"}'
      CodeUri: ReportFunction
    Metadata:
      SamResourceId: ReportFunction
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::If:
        - HasWebBucketName
        - Ref: WebBucketName
        - Ref: AWS::NoValue
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name:
          Fn::Sub: ${AWS::StackName}-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
        - Id: web
          DomainName:
            Fn::GetAtt:
            - WebBucket
            - RegionalDomainName
          OriginAccessControlId:
            Fn::GetAtt:
            - WebOAC
            - Id
          S3OriginConfig:
            OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${WebBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}
Outputs:
  ApiUrl:
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod
  ApiKeyId:
    Description: aws apigateway get-api-key --api-key <id> --include-value
    Value:
      Ref: ApiApiKey
  DataBucketName:
    Value:
      Ref: DataBucket
  WebBucketName:
    Value:
      Ref: WebBucket
  DashboardUrl:
    Value:
      Fn::Sub: https://${WebDistribution.DomainName}
