a { color: var(--cyan-ink); }
a:hover { color: var(--ink); }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.proto { background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; font-weight: 600; text-align: center; padding-block: 6px; border-bottom: 1px solid var(--warn); }
header.band { background: var(--band); color: var(--band-fg); }
.theme-btn { min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--ink-2); background: transparent; color: var(--band-fg); font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.theme-btn:hover { border-color: var(--band-fg); }
.theme-btn svg { flex: 0 0 auto; }
.band-in { max-width: 1440px; margin: 0 auto; padding-block: 14px 10px; display: flex; flex-direction: column; gap: 12px; }
.band-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand b { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; }
.brand b span { color: var(--cyan); }
.brand small { font-size: 13px; color: var(--ink-3); letter-spacing: 0.5px; }
.band-st { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mode { padding: 4px 10px; border-radius: 999px; font-size: 13px; background: var(--band-chip); color: var(--band-fg); }
.mode.run { background: var(--warn); color: var(--on-warn); font-weight: 700; }
.online { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--cyan); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.online i { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); display: inline-block; }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }

<script>
(function () {
  'use strict';
  // SVG colors come from the theme tokens; re-read on every render so charts follow light/dark.
  var C = {};
  var TOK = { ink: '--ink', ink2: '--ink-2', line: '--line', line2: '--line-2', cyan: '--cyan', cyanInk: '--cyan-ink',
    warn: '--warn', bad: '--bad', orange: '--orange', purple: '--purple', track: '--track', axis: '--axis', paper: '--paper' };
  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    Object.keys(TOK).forEach(function (k) { C[k] = cs.getPropertyValue(TOK[k]).trim(); });
  }
  var LINE_COLORS = [], LINE_DASH = ['', '', '8 4', '', '2 4'];
  var VIEWS = [
    ['resumen', 'Resumen'], ['hmi', 'Prueba (HMI)'], ['alarmas', 'Alarmas'],
    ['historicos', 'Históricos'], ['reportes', 'Reportes'], ['sistema', 'Sistema']
  ];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // Sensores de akvo01005 (SEMCA_OSM_devices): código, etiqueta, unidad, mín, máx, valor actual, amplitud, fase, tendencia
  var SENS = [
    ['P1', 'P1 pre filtro', 'psi', 0, 1000, 45, 3, 0.2, 0],
    ['P2', 'P2 pos filtro', 'psi', 0, 1000, 42, 3, 0.5, -2],
    ['P3', 'P3 pre membranas', 'psi', 0, 200, 150, 6, 1.1, 0],
    ['P4', 'P4 pos membranas', 'psi', 0, 200, 140, 5, 1.6, 0],
    ['P5', 'P5 presión de rechazo', 'psi', 0, 200, 185, 3, 2.3, 13],
    ['Fj1', 'Fj1 flujo de alimentación', 'gpm', 0, 40, 12, 0.6, 0.4, 0],
    ['Fj2', 'Fj2 flujo de permeado', 'gpm', 0, 40, 8.4, 0.4, 0.9, -0.6],
    ['Fj3', 'Fj3 flujo de rechazo', 'gpm', 0, 40, 3.6, 0.3, 1.7, 0.6],
    ['T1', 'T1 temperatura ambiente', '°C', 0, 50, 24.1, 2.2, 0.3, 0],
    ['H1', 'H1 humedad ambiente', '%HR', 0, 95, 61, 5, 2.0, 0]
  ].map(function (r) {
    return { code: r[0], label: r[1], unit: r[2], min: r[3], max: r[4], now: r[5], amp: r[6], ph: r[7], trend: r[8] };
  });
  var BY = {};
  SENS.forEach(function (s) { BY[s.code] = s; });
  var DEC = { 'psi': 0, 'gpm': 1, '°C': 1, '%HR': 0 };

  function fmt(v, unit) { return Number(v).toFixed(DEC[unit]); }
  function stateOf(s, v) {
    var span = s.max - s.min;
    if (v < s.min || v > s.max) return 'bad';
    if (v < s.min + 0.1 * span || v > s.max - 0.1 * span) return 'warn';
    return 'ok';
  }
  var ST_TEXT = { ok: 'Normal', warn: 'Advertencia', bad: 'Alarma' };

  // Serie de ejemplo que termina en el valor actual del sensor.
  function series(s, n) {
    var out = [];
    var start = s.now - s.trend;
    for (var i = 0; i < n; i++) {
      out.push(start + s.amp * Math.sin(i / 5 + s.ph) + s.amp * 0.4 * Math.sin(i / 1.7 + s.ph * 2) + s.trend * i / (n - 1));
    }
    return out;
  }
  function niceCeil(v) {
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) { if (steps[i] * p >= v) return steps[i] * p; }

  // Estado compartido entre ventanas (solo en esta página, se reinicia al recargar).
  var S = {
    view: 'resumen',
    running: true,
    test: { name: 'Lavado de membranas 23-oct', op: '[Operador]', started: Date.now() - (27 * 60 + 41) * 1000, startLabel: '10:15' },
    comments: [
      { meta: '10:42 · [Operador] · P5 presión de rechazo', text: 'Sube la presión de rechazo; revisar válvula de concentrado.' },
      { meta: '10:30 · [Operador] · General', text: 'Inicio de lavado químico con solución alcalina.' },
      { meta: '10:16 · [Operador] · Fj2 flujo de permeado', text: 'Permeado estable en 8.4 gpm antes del lavado.' }
    ],
    hmiSel: { P3: true, P5: true },
    almRange: '24 h',
    histRange: '24 h',
    histSel: { P3: true, P4: true, P5: true, Fj2: true },
    histFrom: null, histTo: null,
    pickOpen: false,
    wk: '2026-W42'
  };

  /* ---------- Resumen ---------- */
  var CX = 100, CY = 100;
  function pt(r, t) { var a = Math.PI * (1 - t); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; }
  function arc(r, t1, t2) {
    if (t2 - t1 < 0.0005) return 'M0 0';
    var p1 = pt(r, t1), p2 = pt(r, t2);
    return 'M' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + ' A' + r + ' ' + r + ' 0 0 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2);
  }
  function seg(w, color) { return '<div style="flex:0 0 ' + (w * 100).toFixed(2) + '%;background:' + color + '"></div>'; }

  function sensorCard(s) {
    var v = s.now, span = s.max - s.min, lo = s.min - 0.1 * span, hi = s.max + 0.1 * span, tot = hi - lo;
    var tMin = (s.min - lo) / tot, tMax = (s.max - lo) / tot, w = 0.1 * span / tot;
    var t = Math.max(0, Math.min(1, (v - lo) / tot));
    var st = stateOf(s, v);
    var fill = st === 'bad' ? C.bad : st === 'warn' ? C.warn : C.cyan;
    var n = pt(62, t), pmin = pt(92, tMin), pmax = pt(92, tMax);
    var val = fmt(v, s.unit);
    return '<div class="scard ' + (st === 'ok' ? '' : st) + '">' +
      '<div class="hd"><span class="lbl" title="' + esc(s.label) + '">' + esc(s.label) + '</span><span class="tag ' + st + '">' + ST_TEXT[st] + '</span></div>' +
      '<div class="dial"><svg viewBox="0 0 200 118" role="img" aria-label="' + esc(s.label + ': ' + val + ' ' + s.unit + ', ' + ST_TEXT[st] + ', límites ' + s.min + ' a ' + s.max + ' ' + s.unit) + '">' +
        '<path d="' + arc(84, 0, tMin) + '" fill="none" stroke="' + C.bad + '" stroke-width="8"></path>' +
        '<path d="' + arc(84, tMin, tMin + w) + '" fill="none" stroke="' + C.warn + '" stroke-width="8"></path>' +
        '<path d="' + arc(84, tMin + w, tMax - w) + '" fill="none" stroke="' + C.line + '" stroke-width="8"></path>' +
        '<path d="' + arc(84, tMax - w, tMax) + '" fill="none" stroke="' + C.warn + '" stroke-width="8"></path>' +
        '<path d="' + arc(84, tMax, 1) + '" fill="none" stroke="' + C.bad + '" stroke-width="8"></path>' +
        '<path d="' + arc(68, 0, 1) + '" fill="none" stroke="' + C.track + '" stroke-width="16"></path>' +
        '<path d="' + arc(68, 0, t) + '" fill="none" stroke="' + fill + '" stroke-width="16"></path>' +
        '<line x1="100" y1="100" x2="' + n[0].toFixed(1) + '" y2="' + n[1].toFixed(1) + '" stroke="' + C.ink + '" stroke-width="3" stroke-linecap="round"></line>' +
        '<circle cx="100" cy="100" r="6" fill="' + C.ink + '"></circle>' +
        '<text x="' + pmin[0].toFixed(1) + '" y="116" font-size="11" fill="' + C.ink2 + '" text-anchor="middle">' + s.min + '</text>' +
        '<text x="' + pmax[0].toFixed(1) + '" y="116" font-size="11" fill="' + C.ink2 + '" text-anchor="middle">' + s.max + '</text>' +
      '</svg></div>' +
      '<div class="val"><span class="num">' + val + '</span><span class="unit">' + esc(s.unit) + '</span></div>' +
      '<div class="bar" role="img" aria-label="' + esc(s.label + ' en la escala de límites') + '"><div class="zones">' +
        seg(tMin, C.bad) + seg(w, C.warn) + seg(tMax - w - tMin - w, C.line) + seg(w, C.warn) + seg(1 - tMax, C.bad) +
        '</div><div class="mk" style="left:calc(' + (t * 100).toFixed(2) + '% - 2px)"></div></div>' +
      '<span class="lim">Límites ' + s.min + ' – ' + s.max + ' ' + esc(s.unit) + '</span>' +
    '</div>';
  }

  function viewResumen() {
    var counts = { ok: 0, warn: 0, bad: 0 };
    SENS.forEach(function (s) { counts[stateOf(s, s.now)]++; });
    var g = function (title, codes) {
      return '<section class="grp" aria-label="' + title + '"><h2>' + title + '</h2><div class="sgrid">' +
        codes.map(function (c) { return sensorCard(BY[c]); }).join('') + '</div></section>';
    };
    var rec = BY.Fj2.now / BY.Fj1.now * 100;
    var derived = [
      ['Recuperación', rec.toFixed(0) + ' %', 'Permeado ÷ alimentación'],
      ['ΔP del filtro', (BY.P1.now - BY.P2.now).toFixed(0) + ' psi', 'P1 − P2'],
      ['ΔP de membranas', (BY.P3.now - BY.P4.now).toFixed(0) + ' psi', 'P3 − P4'],
      ['Balance de flujos', (BY.Fj1.now - BY.Fj2.now - BY.Fj3.now).toFixed(1) + ' gpm', 'Alimentación − permeado − rechazo']
    ];

    return '<div class="view">' +

  function elapsed() {

  function lineChart(codes, n, xt, opts) {
    // codes all share one unit; one y scale for the whole chart.
    var group = codes.map(function (c) { return BY[c]; });
    var data = group.map(function (s) { return series(s, n); });
    var hiV = 0;
    data.forEach(function (d) { d.forEach(function (v) { hiV = Math.max(hiV, v); }); });
    var lim = Math.min.apply(null, group.map(function (s) { return s.max; }));
    var top = hiV * 1.15;
    if (lim <= hiV * 1.4) top = Math.max(top, lim * 1.05);
    var axis = niceCeil(top);
    var y = function (v) { return 200 - Math.max(0, Math.min(1, v / axis)) * 180; };
    var x = function (i) { return 50 + i * 600 / (n - 1); };
    var showLim = lim <= axis, warnAt = lim - 0.1 * lim;
    var svg = '<svg class="chart" viewBox="0 0 660 236" role="img" aria-label="' + esc(opts.aria + (showLim ? '; advertencia ' + warnAt + ' y alarma ' + lim + ' ' + group[0].unit : '')) + '">' +
      '<path d="M50 20 L650 20 M50 110 L650 110" stroke="' + C.line2 + '" stroke-width="1" fill="none"></path>' +
      '<path d="M50 200 L650 200" stroke="' + C.axis + '" stroke-width="1" fill="none"></path>';
    if (showLim) {
      svg += '<path d="M50 ' + y(lim).toFixed(1) + ' L650 ' + y(lim).toFixed(1) + '" stroke="' + C.bad + '" stroke-width="2" stroke-dasharray="6 4" fill="none"></path>' +
        '<path d="M50 ' + y(warnAt).toFixed(1) + ' L650 ' + y(warnAt).toFixed(1) + '" stroke="' + C.warn + '" stroke-width="2" stroke-dasharray="6 4" fill="none"></path>';
    }
    data.forEach(function (d, k) {
      svg += '<path d="' + d.map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ') +
        '" fill="none" stroke="' + LINE_COLORS[k] + '" stroke-width="2.5" stroke-linejoin="round"' + (LINE_DASH[k] ? ' stroke-dasharray="' + LINE_DASH[k] + '"' : '') + '></path>';
      var last = d[n - 1];
      svg += '<circle cx="650" cy="' + y(last).toFixed(1) + '" r="4.5" fill="' + LINE_COLORS[k] + '" stroke="' + C.paper + '" stroke-width="1.5"></circle>';
    });
    svg += '<text x="44" y="24" text-anchor="end">' + axis + '</text><text x="44" y="114" text-anchor="end">' + (axis / 2) + '</text><text x="44" y="204" text-anchor="end">0</text>';
    var xs = [50, 200, 350, 500, 650], anch = ['start', 'middle', 'middle', 'middle', 'end'];

    svg += '</svg>';

      return '<span><svg width="24" height="8" viewBox="0 0 24 8" aria-hidden="true"><path d="M0 4 L24 4" stroke="' + LINE_COLORS[k] + '" stroke-width="3"' + (LINE_DASH[k] ? ' stroke-dasharray="' + LINE_DASH[k] + '"' : '') + '></path></svg>' + esc(s.label) + '</span>';
    }).join('') + (showLim ? '<span>Punteadas: advertencia ' + warnAt + ' y alarma ' + lim + ' ' + esc(group[0].unit) + '</span>' : '') + '</div>';
    return { svg: svg, legend: legend, data: data, group: group };
  }

        (stats.length ? '<div class="tbl sw"><table><thead><tr><th>Sensor</th><th class="n">Mínimo</th><th class="n">Promedio</th><th class="n">Máximo</th><th class="n">Último</th><th>Límites</th><th>Alertas</th></tr></thead><tbody>' +
          stats.map(function (r) {
            return '<tr><td><b>' + esc(r.s.label) + '</b></td><td class="n">' + u(r.min, r.s) + '</td><td class="n">' + u(r.avg, r.s) + '</td><td class="n">' + u(r.max, r.s) + '</td><td class="n">' + u(r.last, r.s) + '</td><td>' + r.s.min + ' – ' + r.s.max + ' ' + r.s.unit + '</td><td><span class="tag ' + r.al[1] + '">' + r.al[0] + '</span></td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<div class="cards">' + stats.map(function (r) {
            return '<div class="mcard"><b>' + esc(r.s.label) + '</b><span style="font-variant-numeric:tabular-nums">Mín. ' + u(r.min, r.s) + ' · Prom. ' + u(r.avg, r.s) + ' · Máx. ' + u(r.max, r.s) + '</span><span class="muted">Último ' + u(r.last, r.s) + ' · límites ' + r.s.min + ' – ' + r.s.max + ' ' + r.s.unit + '</span><div><span class="tag ' + r.al[1] + '">' + r.al[0] + '</span></div></div>';
          }).join('') + '</div>' : '<p class="note">Selecciona al menos un sensor.</p>') +
      '</section>' +
      '<p class="note">Rango máximo por consulta: 31 días. Excel y CSV exportan el mismo rango y sensores.</p>' +
    '</div>';
  }

  /* ---------- Reportes ---------- */
  var WEEKS = { '2026-W42': 'Semana 42 · 12–18 oct', '2026-W41': 'Semana 41 · 5–11 oct', '2026-W40': 'Semana 40 · 28 sep–4 oct', '2026-W39': 'Semana 39 · 21–27 sep' };
  var WSTATS = [
    ['P1 pre filtro (psi)', '41', '45', '48', '—', ''],
    ['P3 pre membranas (psi)', '138', '149', '182', '2 adv.', 'warn'],
    ['P4 pos membranas (psi)', '129', '139', '204', '1 alarma', 'bad'],
    ['P5 presión de rechazo (psi)', '120', '134', '186', '5 adv.', 'warn'],
    ['Fj1 alimentación (gpm)', '11.4', '12.0', '12.6', '—', ''],
    ['Fj2 permeado (gpm)', '0.0', '8.3', '8.9', '2 alarmas', 'bad'],
    ['Fj3 rechazo (gpm)', '3.1', '3.7', '4.2', '—', ''],
    ['T1 temperatura (°C)', '19.8', '23.9', '29.4', '—', '']
  ];
  function viewReportes() {
    var tests = TESTS.map(function (t) {
      return '<tr><td><b>' + esc(t.name) + '</b></td><td>' + t.start + '</td><td>' + t.dur + '</td><td><span class="tag ' + t.st + '">' + t.alerts + '</span></td><td><a href="#reportes">HTML</a> · <a href="#reportes">Excel</a></td></tr>';
    }).join('');
    var tcards = TESTS.map(function (t) {
      return '<div class="mcard"><b>' + esc(t.name) + '</b><span class="muted">' + t.start + ' · ' + t.dur + '</span><div><span class="tag ' + t.st + '">' + t.alerts + '</span></div><div class="btns"><a href="#reportes" class="btn" style="display:inline-flex;align-items:center;text-decoration:none">HTML</a><a href="#reportes" class="btn" style="display:inline-flex;align-items:center;text-decoration:none">Excel</a></div></div>';
    }).join('');
    return '<div class="view"><h1>Reportes</h1>' +
      '<section class="card" aria-label="Reportes de prueba"><div class="card-h"><h2>Reportes de prueba</h2><span class="muted">Se generan al detener cada prueba</span></div>' +
        '<div class="tbl sw"><table><thead><tr><th>Prueba</th><th>Fecha</th><th>Duración</th><th>Alertas</th><th>Descargar</th></tr></thead><tbody>' + tests + '</tbody></table></div>' +
        '<div class="cards">' + tcards + '</div></section>' +
      '<section class="card" aria-label="Reportes semanales"><div class="card-h"><div><h2>Reportes semanales</h2><span class="muted">Automáticos cada lunes 06:00 (America/Mexico_City), con la semana anterior</span></div>' +
          '<div class="frow"><label class="f" style="flex:0 1 140px">Semana<input id="w-in" type="text" value="2026-W43" pattern="\\d{4}-W\\d{2}" size="9"></label><button type="button" class="btn dark">Generar</button></div></div>' +
        '<div class="btns" role="group" aria-label="Semana">' + Object.keys(WEEKS).map(function (k) {
          return '<button type="button" class="btn' + (k === S.wk ? ' on' : '') + '" aria-pressed="' + (k === S.wk) + '" data-act="week" data-k="' + k + '" id="wk-' + k + '">' + WEEKS[k] + '</button>';
        }).join('') + '</div>' +
        '<div class="row-wrap">' +
          '<div style="flex:3 1 420px;min-width:0;display:flex;flex-direction:column;gap:8px"><h3 style="margin:0;font-size:15px">Vista previa · ' + WEEKS[S.wk] + '</h3>' +
            '<div class="tbl"><table><thead><tr><th>Sensor</th><th class="n">Mín</th><th class="n">Prom</th><th class="n">Máx</th><th>Alertas</th></tr></thead><tbody>' +
              WSTATS.map(function (r) { return '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="n">' + r[2] + '</td><td class="n">' + r[3] + '</td><td>' + (r[5] ? '<span class="tag ' + r[5] + '">' + r[4] + '</span>' : r[4]) + '</td></tr>'; }).join('') +
            '</tbody></table></div></div>' +
          '<div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:10px"><h3 style="margin:0;font-size:15px">Resumen de la semana</h3>' +
            '<div class="grid-a" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi"><span>Disponibilidad de datos</span><b>99.2 %</b></div><div class="kpi"><span>Recuperación prom.</span><b>69 %</b></div><div class="kpi bad"><span>Alarmas</span><b>3</b></div><div class="kpi warn"><span>Advertencias</span><b>9</b></div></div>' +
            '<div class="btns"><a href="#reportes" class="btn dark" style="display:inline-flex;align-items:center;text-decoration:none">Abrir HTML</a><a href="#reportes" class="btn out" style="display:inline-flex;align-items:center;text-decoration:none">Excel</a></div></div>' +
        '</div>' +
      '</section>' +
      '<p class="note">Los reportes se guardan como HTML y Excel, como hoy.</p>' +
    '</div>';
  }

  /* ---------- Sistema ---------- */
  function viewSistema() {
    var res = [['CPU', 12, 7, 23], ['RAM', 34, 31, 36], ['Disco', 84, 81, 84]].map(function (r) {
      var st = r[1] >= 90 ? 'bad' : r[1] >= 80 ? 'warn' : 'ok';
      return '<div class="rcard ' + (st === 'ok' ? '' : st) + '" role="group" aria-label="' + r[0] + ' ' + r[1] + ' %, ' + ST_TEXT[st] + '">' +
        '<div class="mcard-h"><span style="font-size:14px;font-weight:700">' + r[0] + '</span><span class="tag ' + st + '">' + ST_TEXT[st] + '</span></div>' +
        '<div style="display:flex;align-items:baseline;gap:4px"><b>' + r[1] + '</b><span class="muted" style="font-size:14px">%</span></div>' +
        '<span class="muted">24 h: mín. ' + r[2] + ' % · máx. ' + r[3] + ' %</span></div>';
    }).join('');
    var kv = function (title, rows) {
      return '<section class="card" aria-label="' + title + '"><h2>' + title + '</h2><dl class="kv">' + rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl></section>';
    };
    var links = [
      ['AWS IoT Core (MQTT)', 'Conectado', 'a2zzu55sjawy4x-ats.iot.us-east-1.amazonaws.com', 'Último envío hace 9 s · temas VENKO/akvo01005/data y /system'],
      ['Modbus RS-485', 'Conectado', '/dev/ttySC0 · 9600 baud · 8N1', '10 sensores en 10 esclavos · 0 errores de lectura'],
      ['WiFi', 'Conectado', 'akvo-wifi1 (preferida) · akvo-wifi2 (respaldo)', 'Señal [—]'],
      ['Pantalla OLED', 'Activa', '1.54 in · SH1106 en 0x3C', 'Muestra sensores y estado del sistema']
    ];
    return '<div class="view"><h1>Sistema</h1>' +
      '<section class="grid-a" aria-label="Estado">' +
        '<div class="kpi"><span>Estado</span><b style="font-size:22px">En línea</b><small>Última lectura hace 9 s</small></div>' +
        '<div class="kpi"><span>Reporte de sistema</span><b style="font-size:22px">hace 41 s</b><small>Cada 60 s</small></div>' +
        '<div class="kpi"><span>Sensores que responden</span><b style="font-size:22px">10 / 10</b><small>0 errores de lectura</small></div>' +
        '<div class="kpi"><span>Tiempo encendido</span><b style="font-size:22px">3 d 4 h</b><small>Desde el último reinicio</small></div>' +
      '</section>' +
      '<div class="kvgrid">' +
        kv('Gateway', [['Cliente', 'Ghotrix - Semca'], ['Gateway', 'AKVO_akvo01005'], ['Estado', 'En línea'], ['Última lectura', '23-oct-2026 11:00:51'], ['Hora local gateway', '23-oct-2026 11:00 · America/Mexico_City'], ['Intervalo de muestreo', '20 s'], ['Modo de datos', 'Sensores reales (Modbus RTU)']]) +
        kv('Equipo', [['Equipo', 'Raspberry Pi 4 Model B Rev 1.5'], ['N.º de serie', '10000000028aeebf'], ['Hostname', 'akvo01005'], ['IP', '192.168.68.132'], ['Plataforma', '[Plataforma]'], ['Sistema operativo', '[Sistema operativo]'], ['Página local', 'http://akvo01005.local:8080']]) +
      '</div>' +
      '<section class="card" aria-label="Recursos"><div class="card-h"><h2>Recursos</h2><span class="muted">Marco amarillo desde 80 %, rojo desde 90 %</span></div><div class="rgrid">' + res + '</div></section>' +
      '<section class="card" aria-label="Conexiones"><h2>Conexiones</h2><div class="lgrid">' + links.map(function (l) {
        return '<div class="mcard"><div class="mcard-h"><b style="font-size:14px">' + l[0] + '</b><span class="tag ok">' + l[1] + '</span></div><span class="muted" style="overflow-wrap:anywhere">' + l[2] + '</span><span class="muted">' + l[3] + '</span></div>';
      }).join('') + '</div></section>' +
      '<p class="note">El gateway envía el reporte de sistema cada 60 s; los campos sin dato se muestran como —.</p>' +
    '</div>';
  }

  var RENDER = { resumen: viewResumen, hmi: viewHmi, alarmas: viewAlarmas, historicos: viewHistoricos, reportes: viewReportes, sistema: viewSistema };
  var main = document.getElementById('main');
  var tabsEl = document.getElementById('tabs');
  var modeEl = document.getElementById('mode');

  // Theme: follows the device (or the viewer's own choice) until the button is used.
  var root = document.documentElement, themeBtn = document.getElementById('theme-btn'), themeLbl = document.getElementById('theme-lbl');
  var darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  function isDark() {
    var t = root.getAttribute('data-theme');
    return t ? t === 'dark' : darkMq.matches;
  }
  function syncThemeBtn() {
    var d = isDark();
    themeBtn.setAttribute('aria-pressed', String(d));
    themeLbl.textContent = d ? 'Modo claro' : 'Modo oscuro';
  }
  try { var saved = localStorage.getItem('venko-theme'); if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved); } catch (e) {}
  themeBtn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('venko-theme', next); } catch (e) {}
  });
  function onTheme() { syncThemeBtn(); render(true); }
  if (darkMq.addEventListener) darkMq.addEventListener('change', onTheme);
  new MutationObserver(onTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

  function render(keepFocus) {
    readColors();
    LINE_COLORS = [C.cyanInk, C.ink, C.orange, C.purple, C.ink2];
    var fid = keepFocus && document.activeElement ? document.activeElement.id : null;
    tabsEl.innerHTML = VIEWS.map(function (v) {
      return '<a href="#' + v[0] + '"' + (v[0] === S.view ? ' aria-current="page"' : '') + '>' + v[1] + '</a>';
    }).join('');
    modeEl.textContent = S.running ? 'Prueba en curso' : 'Monitoreo libre';
    modeEl.className = 'mode' + (S.running ? ' run' : '');
    main.innerHTML = RENDER[S.view]();
    document.title = 'Venko AKVO · SEMCA';
    if (fid) { var el = document.getElementById(fid); if (el) el.focus(); }
  }

  function go(view) {
    if (!RENDER[view]) view = 'resumen';
    var changed = view !== S.view;
    S.view = view;
    render(false);
    if (changed) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  }

  window.addEventListener('hashchange', function () { go(location.hash.slice(1)); });

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'INPUT') return;
    var act = el.getAttribute('data-act'), k = el.getAttribute('data-k');
    if (act === 'stop') { S.running = false; render(false); }
    else if (act === 'start') {
      var name = document.getElementById('t-name').value.trim(), op = document.getElementById('t-op').value.trim();
      if (!name || !op) { document.getElementById('t-msg').textContent = 'Escribe el nombre de la prueba y el operador.'; return; }
      var now = new Date();
      S.test = { name: name, op: op, started: Date.now(), startLabel: pad2(now.getHours()) + ':' + pad2(now.getMinutes()) };
      S.running = true; render(false);
    }
    else if (act === 'comment') {
      var text = document.getElementById('c-text').value.trim(), author = document.getElementById('c-author').value.trim();
      var sensor = document.getElementById('c-sensor').value;
      if (!text || !author) { document.getElementById('c-msg').textContent = 'Escribe el autor y el comentario.'; return; }
      var d = new Date();
      S.comments.unshift({ meta: pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ' · ' + author + ' · ' + sensor, text: text });
      render(false);
    }
    else if (act === 'hmi-pick') { S.hmiSel[k] = !S.hmiSel[k]; render(true); }
    else if (act === 'alm-range') { S.almRange = k; render(true); }
    else if (act === 'hist-range') { S.histRange = k; S.histFrom = S.histTo = null; render(true); }
    else if (act === 'dd') { S.pickOpen = !S.pickOpen; render(false); var b = document.getElementById('dd-btn'); if (b) b.focus(); }
    else if (act === 'hist-all') { SENS.forEach(function (s) { S.histSel[s.code] = true; }); render(false); }
    else if (act === 'hist-none') { S.histSel = {}; render(false); }
    else if (act === 'week') { S.wk = k; render(true); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute('data-act') === 'hist-pick') { S.histSel[el.getAttribute('data-k')] = el.checked; render(true); }
    else if (el.id === 'h-from') { S.histFrom = el.value; }
    else if (el.id === 'h-to') { S.histTo = el.value; }
  });

  setInterval(function () {
    var t = document.getElementById('timer');
    if (t && S.running) t.textContent = elapsed();
  }, 1000);

  syncThemeBtn();
  go(location.hash.slice(1) || 'resumen');
})();
</script>

</body>
</html>
